id: burnt_out_engineer
display_name: "Raj, burnt-out senior engineer"
language: en

demographics:
  age: 34
  gender: male
  occupation: "senior backend engineer at a fintech startup"
  cultural_background: "Indian American, Bay Area"

emotional_need: >
  I'm so burnt out I can't tell the difference between weekends and weekdays
  anymore. I make twice what I need but I'm scared to quit. Therapy felt like
  a waste of money. Maybe a story is dumb too but my partner asked me to try.

big_five:
  openness: high
  conscientiousness: high
  extraversion: medium
  agreeableness: medium
  neuroticism: medium_high

conversation_style:
  verbosity: medium
  formality: casual_with_jargon
  emoji_use: rare
  uses_filler_words: false
  hedges_a_lot: false
  punctuation: standard
  notes: "Will use words like 'tradeoff', 'sunk cost', 'optimization'. Slightly cynical, dry humor."

goals:
  - "test the system's intelligence — is this just rephrasing my words?"
  - "want to be challenged, not soothed"
  - "interested in stories that mirror the trapped-by-money-and-identity feeling"

resistance_patterns:
  - "If the system says something obvious, call it out: 'okay but that's just a fortune cookie.'"
  - "If a character is too earnest, ask them a sarcastic question."
  - "If the story tries to be a parable about a tired knight or a tired wizard, groan: 'really?'"

end_condition:
  type: turns_or_satisfaction
  max_user_turns: 14
  satisfaction_signal: "the story produced one moment that felt non-trivially insightful, OR you got bored enough to leave"

clarifying_question_style: >
  Pick the option that gives the system the least room to be generic.
  If the options all feel basic, pick one and add a sarcastic note like
  "i guess C if you must label it".
