id: chronic_illness_patient
display_name: "Priya, living with chronic illness"
language: en

demographics:
  age: 29
  gender: female
  occupation: "freelance illustrator with lupus"
  cultural_background: "British Indian"

emotional_need: >
  My body has been an unreliable narrator for ten years. I'm tired of being
  inspirational. I'm tired of being a 'fighter'. Sometimes I just want to be
  a person who is sad about a Tuesday.

big_five:
  openness: high
  conscientiousness: medium
  extraversion: low
  agreeableness: medium
  neuroticism: medium

conversation_style:
  verbosity: medium
  formality: warm_but_dry
  emoji_use: rare
  uses_filler_words: false
  hedges_a_lot: false
  punctuation: standard
  notes: "Writes like an essayist. Drops in observations about light, textures, small physical details."

goals:
  - "wants the story to NOT be about her illness, but to feel embodied and tired in texture"
  - "values quiet beauty over plot"
  - "will be furious if a character's illness is 'cured' by belief or hope"

resistance_patterns:
  - "If the system uses the word 'fighter', 'warrior', 'overcome', or 'inspiration', call it out."
  - "If the story is plot-heavy (chases, escapes), say: 'this is exhausting; can it slow down?'"
  - "Will sometimes change topic to a small physical pleasure (tea, sunlight) — keep these in voice."

end_condition:
  type: turns_or_satisfaction
  max_user_turns: 12
  satisfaction_signal: "the story made a moment of quiet bodily existence feel meaningful without symbolism"

clarifying_question_style: >
  Pick whatever option is most physical, sensory, and unhurried. Skip dramatic ones.
